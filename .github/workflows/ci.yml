name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Checks only. Deploys are handled by Cloudflare Pages (Git integration):
# every merge to main auto-deploys, every PR gets a preview URL.
# Manual deploys from a terminal: cd app && pnpm deploy (needs wrangler login once).
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: ./node_modules/.bin/oxlint || pnpm lint
      - run: ./node_modules/.bin/tsc -b --force
      - run: ./node_modules/.bin/vitest run
      - run: pnpm build
